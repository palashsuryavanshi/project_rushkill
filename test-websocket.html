<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test</title>
</head>
<body>
    <h1>WebSocket Connection Test</h1>
    <div id="status">Status: Not connected</div>
    <div id="messages"></div>
    
    <script>
        const statusDiv = document.getElementById('status');
        const messagesDiv = document.getElementById('messages');
        
        function log(message) {
            const div = document.createElement('div');
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            messagesDiv.appendChild(div);
            console.log(message);
        }
        
        const testRoom = 'TEST123';
        const ws = new WebSocket(`ws://localhost:3000?room=${testRoom}`);
        
        ws.onopen = () => {
            statusDiv.textContent = 'Status: Connected';
            log('WebSocket connection opened');
            
            // Send join message
            const joinMsg = {
                type: 'join',
                name: 'TestPlayer'
            };
            
            log('Sending join message: ' + JSON.stringify(joinMsg));
            ws.send(JSON.stringify(joinMsg));
        };
        
        ws.onmessage = (event) => {
            log('Received message: ' + event.data);
            
            try {
                const msg = JSON.parse(event.data);
                if (msg.type === 'joined') {
                    log('Successfully joined room!');
                    log('Assigned ID: ' + msg.id);
                    log('Is host: ' + msg.self);
                    
                    // Close connection after a short delay
                    setTimeout(() => {
                        log('Closing connection');
                        ws.close();
                    }, 2000);
                } else if (msg.type === 'error') {
                    log('Error from server: ' + msg.message);
                    ws.close();
                }
            } catch (err) {
                log('Failed to parse message: ' + err);
                ws.close();
            }
        };
        
        ws.onclose = () => {
            statusDiv.textContent = 'Status: Disconnected';
            log('WebSocket connection closed');
        };
        
        ws.onerror = (err) => {
            statusDiv.textContent = 'Status: Error';
            log('WebSocket error: ' + err);
        };
        
        // Timeout after 10 seconds
        setTimeout(() => {
            if (ws.readyState === WebSocket.OPEN) {
                log('Test timed out, closing connection');
                ws.close();
            }
        }, 10000);
    </script>
</body>
</html>
