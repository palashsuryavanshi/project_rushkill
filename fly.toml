# fly.toml app configuration file generated for project-rushkill on 2026-11-08T14:18:10Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'project-rushkill'
primary_region = 'maa'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']
  checks = [{ grace_period = '5s', interval = '10s', method = 'get', path = '/', timeout = '2s' }]

[[vm]]
  memory = '256mb'
  cpus = 1
  size = 'shared-cpu-1x'
